; ============================================================
; Прошивка для ESP32-S2 mini (WEMOS LOLIN S2 MINI)
; Датчики: DHT22 (температура/влажность) + MH-Z19B (CO2)
; Сохранение показаний каждые 10 мин в LittleFS
; Веб-интерфейс: реальное время + графики (Chart.js)
; Сборка:  pio run -e lolin_s2_mini
; Запись данных на файловую систему: pio run -e lolin_s2_mini -t uploadfs
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
; веб-интерфейс (src/index.html) вшивается в прошивку при сборке
; Правка после переезда разметки: файл лежит в src/internal/index.html,
; символ PlatformIO -> _binary_src_internal_index_html_start
board_build.embed_files = src/internal/index.html
; собираем только внутренний блок (src/external — для ESP32-C3, отдельный env)
build_src_filter = +<internal/> -<external/>
lib_deps = 
	gyverlibs/Settings@^1.2.5
	plerup/EspSoftwareSerial@^8.2.0
	wifwaf/MH-Z19@^1.5.4
	robtillaart/DHTNEW@^0.5.3
	gyverlibs/WiFiConnector@^1.0.4
	gyverlibs/GyverTimer@^3.2
	adafruit/DHT sensor library@^1.4.6
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.0.0
	mathieucarbou/ESPAsyncWebServer@^3.1.2
	mathieucarbou/AsyncTCP@^3.3.0

; ============================================================
; Внутренний блок (целевая плата): WEMOS LOLIN S2 MINI
; Сборка:  pio run -e lolin_s2_mini -t upload
; ============================================================
[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.embed_files = src/internal/index.html
build_src_filter = +<internal/> -<external/>
lib_deps = 
	wifwaf/MH-Z19@^1.5.4
	adafruit/DHT sensor library@^1.4.6
	bblanchon/ArduinoJson@^7.0.0
	mathieucarbou/ESPAsyncWebServer@^3.1.2
	mathieucarbou/AsyncTCP@^3.3.0

; ============================================================
; Внешний блок: ESP32-C3 SuperMini + BME280, ESP-NOW -> внутренний блок
; Сборка:  pio run -e esp32c3_supermini -t upload
; ============================================================
[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.embed_files =
build_src_filter = +<external/> -<internal/>
lib_deps = 
	adafruit/Adafruit BME280 Library@^2.2.4
	adafruit/Adafruit Unified Sensor@^1.1.14
