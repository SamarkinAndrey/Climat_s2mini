; ============================================================
; Прошивка для ESP32-S2 mini (WEMOS LOLIN S2 MINI)
; Датчики: DHT22 (температура/влажность) + MH-Z19B (CO2)
; Сохранение показаний каждые 10 мин в LittleFS
; Веб-интерфейс: реальное время + графики (Chart.js)
; Сборка:  pio run -e lolin_s2_mini
; Запись данных на файловую систему: pio run -e lolin_s2_mini -t uploadfs
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
; веб-интерфейс (src/index.html) вшивается в прошивку при сборке
board_build.embed_files = src/index.html
lib_deps = 
	gyverlibs/Settings@^1.2.5
	plerup/EspSoftwareSerial@^8.2.0
	wifwaf/MH-Z19@^1.5.4
	robtillaart/DHTNEW@^0.5.3
	gyverlibs/WiFiConnector@^1.0.4
	gyverlibs/GyverTimer@^3.2
	adafruit/DHT sensor library@^1.4.6
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.0.0
	mathieucarbou/ESPAsyncWebServer@^3.1.2
	mathieucarbou/AsyncTCP@^3.3.0

